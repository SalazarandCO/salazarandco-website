ckground:var(--accent,#9ea7b3)}.task:hover{transform:translateY(-1px);box-shadow:0 10px 20px rgba(29,40,54,.08);border-color:#c7d1dc}.task.selected{border-color:#7b9bd8}.task-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.task h3{margin:2px 0 0;font-size:16px;line-height:1.16;letter-spacing:-.02em}.sub{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}.taskmeta{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px}.taskmeta .sub{font-size:9px;letter-spacing:.16em}.taskflag{margin-top:8px;display:inline-flex;align-items:center;gap:6px;border-radius:999px;border:1px solid #f3b2b2;background:#fff7f7;color:var(--red);padding:5px 9px;font-size:9px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}.taskflag.due{border-color:#f0cf83;background:#fff9ee;color:#ab6b06}.tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.tag{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;border-radius:999px;border:1px solid #d9e2ea;padding:5px 9px;background:#f7f9fb;color:#455162}.notesblock{margin-top:10px;border-top:1px solid var(--border);padding-top:10px}.notesblock-head{display:flex;justify-content:space-between;align-items:center;gap:8px}.notesblock-head span{font-size:9px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:#8d98a5}.notespreview{display:grid;gap:7px;margin-top:8px}.note-snippet{border:1px solid #e0e7ef;border-radius:10px;background:#fafbfd;padding:9px 10px}.note-snippet p{margin:0;font-size:12px;line-height:1.42;color:#28323f}.note-snippet small{display:block;margin-top:7px;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}.task-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;font-size:11px;font-weight:700;color:#5d6a79}.statuspill.new{background:#fff7f0;border-color:#f2d2b7;color:#a85b12}.statuspill.open{background:#f4f7fa;border-color:#ced8e3;color:#41536b}.statuspill.done{background:#eefaf2;border-color:#bfe7cc;color:#1f8a4d}.priority.low{background:#eefaf2;border-color:#bfe7cc;color:var(--green)}.priority.medium{background:#fff8ec;border-color:#f0d28b;color:var(--yellow)}.priority.high{background:#fff3f3;border-color:#f3b2b2;color:var(--red)}.overlay{position:fixed;inset:0;background:rgba(245,247,250,.88);backdrop-filter:blur(10px);display:none;align-items:flex-start;justify-content:center;padding:24px;overflow:auto;z-index:50}.overlay.show{display:flex}.modal{width:min(1200px,100%);margin:auto}.modal-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:18px 20px;border-bottom:1px solid var(--border)}.modal-head h2{margin:0;font-size:24px;line-height:1.1;letter-spacing:-.03em}.modal-grid{display:grid;grid-template-columns:1.1fr .9fr}.pane{padding:18px 20px}.pane.left{border-right:1px solid var(--border)}.sectionlabel{margin:0 0 10px;font-size:12px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:#999}.chips{display:flex;flex-wrap:wrap;gap:8px}.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:grid;gap:8px;margin-top:14px}.field label{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#777}.actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:16px}.actions .btn{padding:12px 14px;border-radius:12px;background:#fff;color:#111}.actions .btn.active{border-color:#d4d4d4;background:#fafafa}.priority-select{margin-top:0}.notes{display:grid;gap:10px}.note{border:1px solid var(--border);border-radius:12px;background:#fafafa;padding:14px}.note p{margin:0;line-height:1.55}.note small{display:block;margin-top:10px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}.addnote{margin-top:18px;padding-top:18px;border-top:1px solid var(--border)}.message{margin-top:14px;font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}.message.error{color:var(--red)}.message.ok{color:var(--green)}.emptycard{border:1px dashed var(--border);border-radius:12px;background:#fff;padding:14px;margin-top:10px;color:var(--muted)}

<body>
<main>
  <div class="shell">
    <aside class="sidebar" id="sidebar"></aside>
    <section class="workspace">
      <header class="header">

          <div>
            <h1>SALAZAR &amp; CO Tasks</h1>
          </div>
        </div>

        <button class="btn" id="newTaskBtn" type="button">New task</button>
      </header>

      <section class="search">
        <input id="search" placeholder="Search tasks, notes, tags, names, or dates" autocomplete="off">
      </section>

      <div class="message" id="message"></div>
      <section class="columns" id="columns"></section>
    </section>
  </div>
</main>

<div class="overlay" id="overlay"></div>
<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = 'https://mpdftzjyjgqayuwyojub.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1wZGZ0emp5amdxYXl1d3lvanViIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI5Mjc4ODYsImV4cCI6MjA4ODUwMzg4Nn0.0YbovCIB0a6HyjysW3ZHeC7XQ9tM7pHr1pxOimJz2TE';
const TABLE = 'salazar_tasks';
const LEGACY_CACHE_KEY = 'salazar-co-tasks-v1';
const CACHE_KEY = 'salazar-co-tasks-cloud-cache-v1';
const { createClient } = window.supabase;
const db = createClient(SUPABASE_URL, SUPABASE_ANON, { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false } });

const STATUS = ['NEW_TASK', 'OPEN', 'COMPLETED'];
const statusLabel = s => s === 'NEW_TASK' ? 'New task' : s === 'OPEN' ? 'Open in process' : 'Completed';
const statusMeta = s => s === 'NEW_TASK' ? ['New task','Fresh items waiting to be started'] : s === 'OPEN' ? ['Open in process','Active work you are moving through'] : ['Completed','Closed out and ready for reference'];
const theme = { NEW_TASK:{panel:'new', accent:'#a8a29e'}, OPEN:{panel:'open', accent:'#737373'}, COMPLETED:{panel:'done', accent:'#10b981'} };
const today = () => new Date().toISOString().slice(0,10);
const addDays = (days) => { const d = new Date(); d.setDate(d.getDate() + days); return d.toISOString().slice(0,10); };
const fmtDate = (value) => { if (!value) return 'Not set'; const d = new Date(value + 'T00:00:00'); return isNaN(d) ? value : d.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' }); };
const fmtTime = (value) => { const d = new Date(value); return isNaN(d) ? 'Just now' : d.toLocaleString('en-US', { month:'short', day:'numeric', hour:'numeric', minute:'2-digit' }); };
const parseDateOnly = (value) => { if (!value) return null; const d = new Date(`${value}T00:00:00`); return isNaN(d) ? null : d; };
const daysUntil = (value) => { const d = parseDateOnly(value); if (!d) return null; const start = parseDateOnly(today()); return Math.round((d - start) / 86400000); };
const esc = (s = '') => String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'task-' + Math.random().toString(36).slice(2, 12));
const defaultSeed = () => ([
  { id: uid(), title:'Call title company about Marriott package', status:'NEW_TASK', priority:'High', owner:'Aiden', startedDate:today(), targetCloseDate:addDays(2), tags:['Legal','AMBAR'], notes:[{ id: uid(), body:'Review the latest email chain and confirm what changed in the OA vs. guaranty documents.', createdAt:new Date().toISOString() }], createdAt:new Date().toISOString(), updatedAt:new Date().toISOString() },
  { id: uid(), title:'Draft Kendall blog for tomorrow morning', status:'OPEN', priority:'Medium', owner:'Aiden', startedDate:today(), targetCloseDate:addDays(1), tags:['KHF','Content'], notes:[{ id: uid(), body:'Need a local angle, plain-English headline, and one image-first opener.', createdAt:new Date().toISOString() }], createdAt:new Date().toISOString(), updatedAt:new Date().toISOString() },
  { id: uid(), title:'Send follow-up on Victoria Park call prep', status:'COMPLETED', priority:'Low', owner:'Aiden', startedDate:addDays(-2), targetCloseDate:addDays(-1), tags:['Real Estate'], notes:[{ id: uid(), body:'Workbook delivered and scope narrowed to new-construction townhomes only.', createdAt:new Date().toISOString() }], createdAt:new Date().toISOString(), updatedAt:new Date().toISOString() },
]);
const blankTask = () => ({ id: uid(), title:'', status:'NEW_TASK', priority:'Medium', owner:'Aiden', startedDate:today(), targetCloseDate:addDays(7), tags:['Task'], notes:[], createdAt:new Date().toISOString(), updatedAt:new Date().toISOString() });
const state = { tasks: [], query: '', selectedId: null, modal: null, draft: null, noteText: '', loading: true, syncState: 'Connecting…', message: '', messageTone: '', focus: 'all' };
let liveChannel = null;

function normalizeTask(task){
  const tags = Array.isArray(task.tags) ? task.tags : [];
  const notes = Array.isArray(task.notes) ? task.notes : [];
  return {
    id: task.id,
    title: task.title || '',
    status: STATUS.includes(task.status) ? task.status : 'NEW_TASK',
    priority: ['Low','Medium','High'].includes(task.priority) ? task.priority : 'Medium',
    owner: task.owner || 'Aiden',
    startedDate: task.startedDate || task.started_date || today(),
    targetCloseDate: task.targetCloseDate || task.target_close_date || '',
    tags,
    notes,
    createdAt: task.createdAt || task.created_at || new Date().toISOString(),
    updatedAt: task.updatedAt || task.updated_at || new Date().toISOString(),
  };
}
function rowToTask(row){
  return normalizeTask({
    id: row.id,
    title: row.title,
    status: row.status,
    priority: row.priority,
    owner: row.owner,
    startedDate: row.started_date,
    targetCloseDate: row.target_close_date,
    tags: row.tags || [],
    notes: row.notes || [],
    createdAt: row.created_at,
    updatedAt: row.updated_at,
  });
}
function taskToRow(task){
  return {
    id: task.id,
    title: task.title.trim(),
    status: task.status,
    priority: task.priority,
    owner: task.owner.trim() || 'Aiden',
    started_date: task.startedDate || today(),
    target_close_date: task.targetCloseDate || null,
    tags: task.tags || [],
    notes: task.notes || [],
  };
}
function loadLegacySeed(){
  try { const raw = localStorage.getItem(LEGACY_CACHE_KEY); if (!raw) return []; const parsed = JSON.parse(raw); return Array.isArray(parsed) ? parsed.map(normalizeTask) : []; } catch { return []; }
}
function loadCache(){
  try { const raw = localStorage.getItem(CACHE_KEY); if (!raw) return []; const parsed = JSON.parse(raw); return Array.isArray(parsed) ? parsed.map(normalizeTask) : []; } catch { return []; }
}
function saveCache(tasks){
  try { localStorage.setItem(CACHE_KEY, JSON.stringify(tasks)); } catch {}
}
function setMessage(text, tone = ''){ state.message = text; state.messageTone = tone; }
function setSync(text){ state.syncState = text; }
function initials(name = ''){ return String(name || 'Task').trim().split(/\s+/).slice(0,2).map(part => part[0] || '').join('').toUpperCase() || 'T'; }
function priorityClass(priority){ return priority === 'High' ? 'high' : priority === 'Medium' ? 'medium' : 'low'; }
function statusChipClass(status){ return status === 'NEW_TASK' ? 'new' : status === 'OPEN' ? 'open' : 'done'; }
function sortTasks(a, b){
  const byStatus = STATUS.indexOf(a.status) - STATUS.indexOf(b.status);
  if (byStatus !== 0) return byStatus;
  return new Date(b.updatedAt || b.createdAt || 0) - new Date(a.updatedAt || a.createdAt || 0);
}
function focusMatches(task){
  const days = daysUntil(task.targetCloseDate);
  if (state.focus === 'all') return true;
  if (state.focus === 'new') return task.status === 'NEW_TASK';
  if (state.focus === 'open') return task.status === 'OPEN';
  if (state.focus === 'done') return task.status === 'COMPLETED';
  if (state.focus === 'overdue') return task.status !== 'COMPLETED' && days !== null && days < 0;
  if (state.focus === 'due_today') return task.status !== 'COMPLETED' && days === 0;
  if (state.focus === 'soon') return task.status !== 'COMPLETED' && days !== null && days > 0 && days <= 3;
  return true;
}
function matches(task){
  const q = state.query.trim().toLowerCase();
  if (!focusMatches(task)) return false;
  if (!q) return true;
  return [
    task.title,
    task.owner,
    task.priority,
    task.tags.join(' '),
    task.startedDate,
    task.targetCloseDate,
    (task.notes || []).map(n => n.body).join(' '),
  ].join(' ').toLowerCase().includes(q);
}
function counts(){ const c = { NEW_TASK: 0, OPEN: 0, COMPLETED: 0 }; state.tasks.filter(matches).forEach(t => { c[t.status] += 1; }); return c; }
function openTask(id){ const task = state.tasks.find(t => t.id === id); if (!task) return; state.selectedId = id; state.modal = 'edit'; state.draft = JSON.parse(JSON.stringify(task)); state.noteText = ''; render(); }
function openComposer(){ state.modal = 'create'; state.selectedId = null; state.noteText = ''; state.draft = blankTask(); render(); }
function closeModal(){ state.modal = null; state.draft = null; state.noteText = ''; render(); }
function updateDraft(field, value){ if (!state.draft) return; state.draft[field] = value; }
function setPriority(value){ if (!state.draft) return; state.draft.priority = value; render(); }
function setFocus(value){ state.focus = value; render(); }
function addTagList(text){ return text.split(',').map(s => s.trim()).filter(Boolean).slice(0, 4); }
function isValidDraft(){ return !!(state.draft && state.draft.title && state.draft.title.trim()); }
function dueStatus(task){
  const days = daysUntil(task.targetCloseDate);
  if (days === null || task.status === 'COMPLETED') return null;
  if (days < 0) return { kind: 'overdue', label: `${Math.abs(days)} day${Math.abs(days) === 1 ? '' : 's'} overdue` };
  if (days === 0) return { kind: 'due', label: 'Due today' };
  if (days <= 3) return { kind: 'due', label: `Due in ${days} day${days === 1 ? '' : 's'}` };
  return null;
}
function agendaTasks(){
  return state.tasks
    .filter(matches)
    .filter(t => t.status !== 'COMPLETED')
    .map(t => ({ task: t, days: daysUntil(t.targetCloseDate) }))
    .filter(({ days }) => days !== null)
    .sort((a, b) => a.days - b.days || sortTasks(a.task, b.task))
    .slice(0, 4);
}
function renderSummary(){
  const visible = state.tasks.filter(matches);
  const active = visible.filter(t => t.status !== 'COMPLETED');
  const overdue = active.filter(t => { const days = daysUntil(t.targetCloseDate); return days !== null && days < 0; });
  const todayDue = active.filter(t => daysUntil(t.targetCloseDate) === 0);
  const soon = active.filter(t => { const days = daysUntil(t.targetCloseDate); return days !== null && days > 0 && days <= 3; });
  const agenda = agendaTasks();
  const counts = { all: visible.length, new: visible.filter(t => t.status === 'NEW_TASK').length, open: visible.filter(t => t.status === 'OPEN').length, done: visible.filter(t => t.status === 'COMPLETED').length, overdue: overdue.length, due_today: todayDue.length, soon: soon.length };
  const button = (key, label) => `<button class="sidebtn ${state.focus === key ? 'active' : ''}" onclick="setFocus('${key}')"><span>${label}</span><span class="count">${counts[key] ?? 0}</span></button>`;
  const nowLabel = new Date().toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' });
  document.getElementById('sidebar').innerHTML = `<div class="mini">Pipeline</div><h2>SALAZAR &amp; CO</h2><p>${nowLabel} · task workspace</p><div class="group"><div class="mini">Quick actions</div><div class="side-action"><button class="mini-btn" onclick="openComposer()">New task</button><button class="mini-btn" onclick="setFocus('overdue')">Overdue</button><button class="mini-btn" onclick="setFocus('soon')">Due soon</button></div></div><div class="group"><div class="mini">Views</div><div class="sidegrid" style="margin-top:10px">${button('all','All tasks')}${button('new','New')}${button('open','Open')}${button('done','Done')}${button('overdue','Overdue')}${button('due_today','Due today')}${button('soon','Due soon')}</div></div><div class="group"><div class="mini">Today</div><div class="side-card"><h3>${active.length} active tasks</h3><small>${overdue.length} overdue · ${todayDue.length} due now</small><div class="side-action"><button class="mini-btn" onclick="setMessage('Google Calendar sync is next.', 'ok')">Calendar</button><button class="mini-btn" onclick="setMessage('Gmail sync is next.', 'ok')">Mail</button></div></div><div class="side-card"><h3>Follow-up queue</h3><small>${agenda.length} items ready</small><div class="side-action"><button class="mini-btn" onclick="setFocus('due_today')">Due today</button><button class="mini-btn" onclick="setFocus('soon')">Due soon</button></div></div></div>`;
}
function renderCounts(){ const c = counts(); const labels = { NEW_TASK: 'New', OPEN: 'Open', COMPLETED: 'Done' }; document.getElementById('counts').innerHTML = Object.entries(c).map(([k, v]) => `<div class="pill">${v} ${labels[k] || k}</div>`).join(''); }
function taskCard(task){ const selected = state.selectedId === task.id ? 'selected' : ''; const chip = statusChipClass(task.status); const notes = (task.notes || []).slice(0, 2); const latest = notes[0]; const due = dueStatus(task); return `<article class="task ${selected}" style="--accent:${theme[task.status].accent}" draggable="true" ondragstart="dragStart(event, '${task.id}')" onclick="openTask('${task.id}')"><div class="task-top"><div style="min-width:0"><div class="sub">${esc(task.owner)} · ${fmtDate(task.startedDate)}</div><h3>${esc(task.title)}</h3></div><span class="statuspill ${chip}">${statusLabel(task.status)}</span></div><div class="taskmeta"><span class="sub">${esc(task.owner)}</span><span class="priority ${priorityClass(task.priority)}">${task.priority}</span></div>${due ? `<div class="taskflag ${due.kind}">${due.label}</div>` : ''}<div class="tags">${(task.tags || []).map(tag => `<span class="tag">${esc(tag)}</span>`).join('')}</div><div class="notesblock"><div class="notesblock-head"><span>Notes</span><span>${task.notes?.length || 0} note${(task.notes?.length || 0) === 1 ? '' : 's'}</span></div><div class="notespreview">${notes.length ? notes.map(n => `<div class="note-snippet"><p>${esc(n.body.length > 110 ? `${n.body.slice(0, 110).trimEnd()}…` : n.body)}</p><small>${fmtTime(n.createdAt)}</small></div>`).join('') : '<div class="note-snippet"><p>No notes yet.</p></div>'}</div></div></article>`; }

async function fetchTasks(){
  const { data, error } = await db.from(TABLE).select('*').order('updated_at', { ascending: false });
  if (error) throw error;
  return (data || []).map(rowToTask).sort(sortTasks);
}
async function seedFromLocalOrBlank(){
  const legacy = loadLegacySeed();
  if (legacy.length) {
    const { error } = await db.from(TABLE).insert(legacy.map(taskToRow));
    if (error) throw error;
    return await fetchTasks();
  }
  return [];
}
async function loadRemote({ silent = false } = {}){
  if (!silent) {
    state.loading = true;
    setSync('Loading shared tasks…');
    setMessage('');
    render();
  }
  try {
    let tasks = await fetchTasks();
    if (!tasks.length) {
      setSync('Cloud empty — checking this browser for unsynced tasks…');
      render();
      tasks = await seedFromLocalOrBlank();
    }
    state.tasks = tasks.sort(sortTasks);
    state.selectedId = state.selectedId && state.tasks.some(t => t.id === state.selectedId) ? state.selectedId : null;
    saveCache(state.tasks);
    setSync(state.tasks.length ? 'Synced to cloud' : 'Cloud ready — create the first task');
    setMessage('');
  } catch (err) {
    const fallback = loadCache();
    state.tasks = (fallback.length ? fallback : defaultSeed()).map(normalizeTask).sort(sortTasks);
    setSync('Offline cache');
    setMessage('Cloud sync unavailable — showing this browser\'s cached board.', 'error');
  } finally {
    state.loading = false;
    render();
  }
}
async function saveDraft(){
  if (!isValidDraft()) return;
  const next = normalizeTask({
    ...state.draft,
    title: state.draft.title.trim(),
    owner: state.draft.owner.trim() || 'Aiden',
    tags: addTagList(Array.isArray(state.draft.tags) ? state.draft.tags.join(', ') : String(state.draft.tags || '')),
    updatedAt: new Date().toISOString(),
    createdAt: state.draft.createdAt || new Date().toISOString(),
  });
  const previous = state.tasks.slice();
  state.tasks = state.modal === 'create'
    ? [next, ...state.tasks.filter(t => t.id !== next.id)]
    : state.tasks.map(t => t.id === next.id ? next : t);
  render();
  try {
    setSync('Saving…');
    render();
    const { error } = await db.from(TABLE).upsert(taskToRow(next));
    if (error) throw error;
    await loadRemote({ silent: true });
    closeModal();
    setMessage('Saved to shared board.', 'ok');
  } catch (err) {
    state.tasks = previous;
    setSync('Save failed');
    setMessage('Could not save the task to the shared board.', 'error');
    render();
  }
}
async function deleteDraft(){
  if (!state.draft) return;
  const id = state.draft.id;
  const previous = state.tasks.slice();
  state.tasks = state.tasks.filter(t => t.id !== id);
  render();
  try {
    setSync('Deleting…');
    render();
    const { error } = await db.from(TABLE).delete().eq('id', id);
    if (error) throw error;
    await loadRemote({ silent: true });
    state.selectedId = null;
    closeModal();
    setMessage('Task deleted from the shared board.', 'ok');
  } catch (err) {
    state.tasks = previous;
    setSync('Delete failed');
    setMessage('Could not delete the task.', 'error');
    render();
  }
}
async function saveNote(){
  const body = state.noteText.trim();
  if (!body || !state.draft) return;
  state.draft.notes = [{ id: uid(), body, createdAt: new Date().toISOString() }, ...(state.draft.notes || [])];
  state.noteText = '';
  render();
  if (state.modal === 'edit') await saveDraft();
}
async function setStatus(taskId, status){
  const current = state.tasks.find(t => t.id === taskId);
  if (!current || current.status === status) return;
  const next = normalizeTask({ ...current, status, updatedAt: new Date().toISOString() });
  const previous = state.tasks.slice();
  state.tasks = state.tasks.map(t => t.id === taskId ? next : t);
  render();
  try {
    setSync('Saving status…');
    render();
    const { error } = await db.from(TABLE).update({ status, updated_at: new Date().toISOString() }).eq('id', taskId);
    if (error) throw error;
    await loadRemote({ silent: true });
    setMessage('Task moved.', 'ok');
  } catch (err) {
    state.tasks = previous;
    setSync('Save failed');
    setMessage('Could not move the task.', 'error');
    render();
  }
}
function dragStart(ev, id){ ev.dataTransfer.setData('text/task-id', id); }
function dragOver(ev){ ev.preventDefault(); }
function dropStatus(ev, status){ ev.preventDefault(); const id = ev.dataTransfer.getData('text/task-id'); if (id) setStatus(id, status); }
function renderCounts(){ const c = counts(); const labels = { NEW_TASK: 'New', OPEN: 'Open', COMPLETED: 'Done' }; document.getElementById('counts').innerHTML = Object.entries(c).map(([k, v]) => `<div class="pill">${v} ${labels[k] || k}</div>`).join(''); }
function taskCard(task){ const selected = state.selectedId === task.id ? 'selected' : ''; const chip = statusChipClass(task.status); const notes = (task.notes || []).slice(0, 2); const latest = notes[0]; return `<article class="task ${selected}" style="--accent:${theme[task.status].accent}" draggable="true" ondragstart="dragStart(event, '${task.id}')" onclick="openTask('${task.id}')"><div class="task-top"><div style="min-width:0"><div class="sub">${esc(task.owner)} · ${fmtDate(task.startedDate)}</div><h3>${esc(task.title)}</h3></div><span class="statuspill ${chip}">${statusLabel(task.status)}</span></div><div class="taskmeta"><span class="sub">${esc(task.owner)}</span><span class="priority ${priorityClass(task.priority)}">${task.priority}</span></div><div class="tags">${(task.tags || []).map(tag => `<span class="tag">${esc(tag)}</span>`).join('')}</div><div class="notesblock"><div class="notesblock-head"><span>Notes</span><span>${task.notes?.length || 0} note${(task.notes?.length || 0) === 1 ? '' : 's'}</span></div><div class="notespreview">${notes.length ? notes.map(n => `<div class="note-snippet"><p>${esc(n.body.length > 110 ? `${n.body.slice(0, 110).trimEnd()}…` : n.body)}</p><small>${fmtTime(n.createdAt)}</small></div>`).join('') : '<div class="note-snippet"><p>No notes yet.</p></div>'}</div></div></article>`; }
function renderColumns(){
  const cols = STATUS.map(status => {
    const [title, subtitle] = statusMeta(status);
    const items = state.tasks.filter(t => t.status === status && matches(t)).sort(sortTasks);
    const body = items.length ? items.map(task => taskCard(task)).join('') : '<div class="emptycard">Drop a task here, or create a new one.</div>';
    return `<section class="column ${theme[status].panel}" style="border-top-color:${theme[status].accent}" ondragover="dragOver(event)" ondrop="dropStatus(event, '${status}')"><div class="column-top"><div><div class="bar" style="background:${theme[status].accent}"></div><div class="meta">${esc(subtitle)}</div><h2>${esc(title)}</h2></div><div class="pill">${items.length}</div></div><div>${body}</div></section>`;
  }).join('');
  document.getElementById('columns').innerHTML = cols;
}
function overlayMarkup(){
  if (!state.modal || !state.draft) return '';
  const draft = state.draft;
  const isCreate = state.modal === 'create';
  return `<div class="modal ${isCreate ? 'composer' : ''}"><div class="modal-head"><div><div class="sectionlabel">${isCreate ? 'New task' : 'Task details'}</div><h2>${isCreate ? 'Create a task' : 'Edit and save changes'}</h2></div><button class="btn secondary" onclick="closeModal()">Close</button></div><div class="modal-grid"><div class="pane left"><div class="chips"><span class="statuspill ${statusChipClass(draft.status)}">${statusLabel(draft.status)}</span><span class="priority ${priorityClass(draft.priority)}">${draft.priority}</span></div><div class="field"><label>Task name</label><input value="${esc(draft.title)}" oninput="updateDraft('title', this.value)"></div><div class="row"><div class="field"><label>Name</label><input value="${esc(draft.owner)}" oninput="updateDraft('owner', this.value)"></div><div class="field"><label>Priority</label><div class="actions priority-select"><button class="btn ${draft.priority === 'Low' ? 'active' : ''} secondary" onclick="setPriority('Low')">Low</button><button class="btn ${draft.priority === 'Medium' ? 'active' : ''} secondary" onclick="setPriority('Medium')">Medium</button><button class="btn ${draft.priority === 'High' ? 'active' : ''} secondary" onclick="setPriority('High')">High</button></div></div></div><div class="row"><div class="field"><label>Date started</label><input type="date" value="${draft.startedDate}" oninput="updateDraft('startedDate', this.value)"></div><div class="field"><label>Date to end or close</label><input type="date" value="${draft.targetCloseDate || ''}" oninput="updateDraft('targetCloseDate', this.value)"></div></div><div class="field"><label>Tags</label><input value="${esc((draft.tags || []).join(', '))}" oninput="updateDraft('tags', this.value.split(',').map(s => s.trim()).filter(Boolean).slice(0,4))"></div><div class="actions">${STATUS.map(s => `<button class="btn ${draft.status === s ? 'active' : ''} secondary" onclick="updateDraft('status','${s}')">${statusLabel(s)}</button>`).join('')}</div><div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap"><button class="btn" style="flex:1" onclick="saveDraft()">Save changes</button><button class="btn secondary" onclick="closeModal()">Cancel</button>${state.modal === 'edit' ? '<button class="btn secondary" style="border-color:#fca5a5;color:#991b1b" onclick="deleteDraft()">Delete task</button>' : ''}</div></div><div class="pane"><div class="sectionlabel">Notes</div><div class="notes">${(draft.notes || []).length ? draft.notes.map(n => `<div class="note"><p>${esc(n.body)}</p><small>${fmtTime(n.createdAt)}</small></div>`).join('') : '<div class="note" style="background:#fff">No notes yet.</div>'}</div><div class="addnote"><div class="field"><label>Add note</label><textarea rows="4" placeholder="What happened? What should happen next?" oninput="state.noteText=this.value">${esc(state.noteText || '')}</textarea></div><button class="btn" style="width:100%" onclick="saveNote()">Save note</button></div></div></div></div>`;
}
function render(){
  renderCounts();
  renderSummary();
  renderColumns();
  document.getElementById('overlay').classList.toggle('show', !!state.modal);
  document.getElementById('overlay').innerHTML = overlayMarkup();
  const syncStatus = document.getElementById('syncStatus'); if (syncStatus) syncStatus.textContent = state.syncState;
  const message = document.getElementById('message');
  message.textContent = state.message;
  message.className = state.message ? `message ${state.messageTone || ''}`.trim() : 'message';
}
window.openTask = openTask;
window.openComposer = openComposer;
window.closeModal = closeModal;
window.dragOver = dragOver;
window.dropStatus = dropStatus;
window.dragStart = dragStart;
window.updateDraft = updateDraft;
window.saveDraft = saveDraft;
window.saveNote = saveNote;
window.deleteDraft = deleteDraft;
window.setPriority = setPriority;
window.state = state;
window.addEventListener('focus', () => { if (!state.loading && !state.modal) loadRemote({ silent: true }); });
document.getElementById('search').addEventListener('input', e => { state.query = e.target.value; render(); });
document.getElementById('newTaskBtn').addEventListener('click', openComposer);
document.getElementById('overlay').addEventListener('click', e => { if (e.target.id === 'overlay') closeModal(); });
(async function init(){
  await loadRemote();
  liveChannel = db.channel('salazar_tasks_changes').on('postgres_changes', { event: '*', schema: 'public', table: TABLE }, () => { if (!state.modal) loadRemote({ silent: true }); }).subscribe();
})();
</script>
